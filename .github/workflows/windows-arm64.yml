name: Windows ARM64
on:
  push:
    branches: ['arm64/upstream']
    paths-ignore:
      - '.github/workflows/renderer-check.yml'
      - 'contrib/arm64/README.md'
  workflow_dispatch:
env:
  MPCBE_UPSTREAM_REV: 29
  RELEASE_VERSION: 1.9.3.29
permissions:
  contents: read
concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  codecs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init --depth 1 src/ExtLib/nv-codec-headers src/ExtLib/vvdec/vvdec
      - uses: actions/cache@v4
        id: cache
        with:
          path: libarm64
          key: codecs-arm64-v1-${{ hashFiles('contrib/arm64/*.sh', 'contrib/arm64/ffmpeg-*', 'src/ExtLib/ffmpeg/**', 'src/ExtLib/vvdec/vvdec.h') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y meson ninja-build
          bash contrib/arm64/codecs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-codecs
          path: libarm64/
          if-no-files-found: error
      - name: Generate compressed playback fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg
          mkdir -p media
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=16 -c:a flac media/tone.flac
          ffmpeg -v error -f lavfi -i testsrc2=size=160x96:rate=12:duration=16 -c:v libx264 -threads 2 -pix_fmt yuv420p media/h264.mp4
          ffmpeg -v error -f lavfi -i testsrc2=size=160x96:rate=12:duration=16 -c:v libaom-av1 -cpu-used 8 -threads 2 -crf 45 media/av1.mkv
      - uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: media/
          if-no-files-found: error
  filters:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile native DirectShow filters
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Invoke-WebRequest https://raw.githubusercontent.com/DLTcollab/sse2neon/2272251cc3ad9cba8b8c47c4065811cfb396b802/sse2neon.h -OutFile include/sse2neon.h
          python contrib/arm64/build-filters.py "$vs\MSBuild\Current\Bin\amd64\MSBuild.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: native-filters
          path: filter-artifacts
          if-no-files-found: error
  compatibility:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare upstream x64 static dependencies
        run: |
          git submodule update --init --depth 1 -- src/ExtLib
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          curl.exe -fLsS --retry 3 https://raw.githubusercontent.com/Aleksoid1978/MSYS/3d89b54078e6410b625a618367c7f640da6b9802/MSYS_MinGW-w64_GCC_1521_x86-x64.7z -o "$env:RUNNER_TEMP/msys.7z"
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          7z x "$env:RUNNER_TEMP/msys.7z" -oC:\MSYS -bso0
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          @('@echo off','set "MPCBE_MSYS=C:\MSYS"','set "MPCBE_MINGW=C:\MSYS\mingw"') | Set-Content environments.bat -Encoding ascii
          .\update_gcc.bat
          .\update_revision.cmd
      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: |
            _bin/lib/Release_x64
            _bin/shaders
          key: ec-static-v1-${{ hashFiles('src/**','include/**','lib64/*.lib','lib64/libdav1d.a') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        name: Build the upstream x64 static filter libraries
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $env:_CL_ = '/GL-'
          & "$vs\MSBuild\Current\Bin\amd64\MSBuild.exe" src/apps/mplayerc/mpc-be.vcxproj /m:3 /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$pwd\" /p:CL_MPCount=2 /v:minimal
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _bin/lib/Release_x64
            _bin/shaders
          key: ec-static-v1-${{ hashFiles('src/**','include/**','lib64/*.lib','lib64/libdav1d.a') }}
      - name: Build the ARM64EC player for external x64 plug-ins
        run: ./contrib/arm64/build-ec.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: arm64ec-player
          path: |
            ec-player/*.exe
            ec-player/*.dll
            ec-player/*.ax
            ec-player/Lang/*.dll
          if-no-files-found: error
  player:
    needs: codecs
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch source dependencies
        run: |
          git submodule update --init --depth 1 -- src/ExtLib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest https://raw.githubusercontent.com/DLTcollab/sse2neon/2272251cc3ad9cba8b8c47c4065811cfb396b802/sse2neon.h -OutFile include/sse2neon.h
      - name: Fetch native codec archives
        uses: actions/download-artifact@v4
        with:
          name: arm64-codecs
          path: libarm64
      - name: Build Fraunhofer AAC with the Windows ARM64 C++ toolchain
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=x64
          git clone --quiet --depth 1 --branch v2.0.3 https://github.com/mstorsjo/fdk-aac.git "%RUNNER_TEMP%\fdk-aac"
          if errorlevel 1 exit /b 1
          cmake -S "%RUNNER_TEMP%\fdk-aac" -B "%RUNNER_TEMP%\fdk-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DBUILD_SHARED_LIBS=OFF
          if errorlevel 1 exit /b 1
          cmake --build "%RUNNER_TEMP%\fdk-build"
          if errorlevel 1 exit /b 1
          copy /y "%RUNNER_TEMP%\fdk-build\fdk-aac.lib" libarm64\fdk-aac.lib
      - name: Compile player projects for ARM64
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=x64
          call update_revision.cmd
          msbuild src\apps\mplayerc\mpc-be.vcxproj /m:3 /p:Configuration=Release /p:Platform=ARM64 /p:SolutionDir=%CD%\ /p:CL_MPCount=2 /p:BuildProjectReferences=true /v:minimal /fl "/flp:logfile=arm64-build.log;verbosity=normal"
      - name: Build shell extension, icon and language libraries
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          $root = "$pwd\"
          & $msbuild src/apps/mpciconlib/mpciconlib.vcxproj /p:Configuration=Release /p:Platform=ARM64 "/p:SolutionDir=$root" /v:quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $msbuild src/apps/MPCBEShellExt/MPCBEShellExt.vcxproj /p:Configuration=Release /p:Platform=ARM64 "/p:SolutionDir=$root" /v:quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $project = 'src/apps/mpcresources/mpcresources.vcxproj'
          $configs = ([xml](Get-Content $project -Raw)).Project.ItemGroup.ProjectConfiguration | Where-Object Platform -eq ARM64
          foreach ($config in $configs) {
            & $msbuild $project "/p:Configuration=$($config.Configuration)" /p:Platform=ARM64 "/p:SolutionDir=$root" /v:quiet
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Copy-Item LICENSE.txt,docs/Authors*.txt _bin/mpc-be_ARM64/
          Copy-Item distrib/Shaders,distrib/Shaders11 _bin/mpc-be_ARM64/ -Recurse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-build-log
          path: arm64-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-BE-Windows-ARM64
          path: |
            _bin/mpc-be_ARM64/mpc-be-arm64.exe
            _bin/mpc-be_ARM64/mpciconlib.dll
            _bin/mpc-be_ARM64/Lang/*.dll
            _bin/mpc-be_ARM64/MPCBEShellExt64.dll
            _bin/mpc-be_ARM64/*.txt
            _bin/mpc-be_ARM64/Shaders/
            _bin/mpc-be_ARM64/Shaders11/
          if-no-files-found: error
  installer:
    needs: [player, filters, compatibility]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: MPC-BE-Windows-ARM64
          path: _bin/mpc-be_ARM64
      - uses: actions/download-artifact@v4
        with:
          name: native-filters
          path: _bin/mpc-be_ARM64/Filters
      - uses: actions/download-artifact@v4
        with:
          name: arm64ec-player
          path: _bin/mpc-be_ARM64/Compatibility
      - name: Compile the upstream interactive setup for Windows on Arm
        run: ./contrib/arm64/package-setup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-BE-ARM64-installer
          path: installer/*.exe
          if-no-files-found: error
  playback:
    needs: installer
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: MPC-BE-ARM64-installer
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: media
      - uses: actions/download-artifact@v4
        with:
          name: arm64-codecs
          path: codec-check
      - name: Verify FFmpeg NEON dispatch and calculations
        run: ./codec-check/ffmpeg-dsp-check.exe
      - name: Download previous MSI as an upgrade fixture
        run: |
          New-Item legacy -ItemType Directory | Out-Null
          Invoke-WebRequest 'https://github.com/travertexs/MPC-BE/releases/download/1.9.3-arm64/MPC-BE.1.9.3.arm64.msi' -OutFile legacy/previous.msi
      - name: Drive the wizard and verify the x64 and MSI upgrade
        run: ./contrib/arm64/test-install.ps1 -Version $env:RELEASE_VERSION
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-test-logs
          path: '*.log'
