name: Windows ARM64
on:
  push:
    branches: [windows-arm64]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codecs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init --depth 1 src/ExtLib/nv-codec-headers src/ExtLib/vvdec/vvdec
      - uses: actions/cache@v4
        id: cache
        with:
          path: libarm64
          key: codecs-arm64-v1-${{ hashFiles('contrib/arm64/codecs.sh', 'src/ExtLib/ffmpeg/**', 'src/ExtLib/vvdec/vvdec.h') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y meson ninja-build
          bash contrib/arm64/codecs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-codecs
          path: libarm64/
          if-no-files-found: error
      - name: Generate compressed playback fixtures
        run: |
          sudo apt-get install -y ffmpeg
          mkdir -p media
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=16 -c:a flac media/tone.flac
          ffmpeg -v error -f lavfi -i testsrc2=size=160x96:rate=12:duration=16 -c:v libx264 -threads 2 -pix_fmt yuv420p media/h264.mp4
          ffmpeg -v error -f lavfi -i testsrc2=size=160x96:rate=12:duration=16 -c:v libaom-av1 -cpu-used 8 -threads 2 -crf 45 media/av1.mkv
      - uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: media/
          if-no-files-found: error
  player:
    needs: codecs
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch source dependencies
        run: |
          git submodule update --init --depth 1 -- src/ExtLib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest https://raw.githubusercontent.com/DLTcollab/sse2neon/2272251cc3ad9cba8b8c47c4065811cfb396b802/sse2neon.h -OutFile include/sse2neon.h
      - name: Fetch native codec archives
        uses: actions/download-artifact@v4
        with:
          name: arm64-codecs
          path: libarm64
      - name: Compile player projects for ARM64
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=x64
          call update_revision.cmd
          msbuild src\apps\mplayerc\mpc-be.vcxproj /m:3 /p:Configuration=Release /p:Platform=ARM64 /p:SolutionDir=%CD%\ /p:CL_MPCount=2 /p:BuildProjectReferences=true /v:minimal /fl "/flp:logfile=arm64-build.log;verbosity=normal"
      - name: Build shell extension, icon and language libraries
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          $root = "$pwd\"
          & $msbuild src/apps/mpciconlib/mpciconlib.vcxproj /p:Configuration=Release /p:Platform=ARM64 "/p:SolutionDir=$root" /v:quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $msbuild src/apps/MPCBEShellExt/MPCBEShellExt.vcxproj /p:Configuration=Release /p:Platform=ARM64 "/p:SolutionDir=$root" /v:quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $project = 'src/apps/mpcresources/mpcresources.vcxproj'
          $configs = ([xml](Get-Content $project -Raw)).Project.ItemGroup.ProjectConfiguration | Where-Object Platform -eq ARM64
          foreach ($config in $configs) {
            & $msbuild $project "/p:Configuration=$($config.Configuration)" /p:Platform=ARM64 "/p:SolutionDir=$root" /v:quiet
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Copy-Item LICENSE.txt,docs/Authors*.txt _bin/mpc-be_ARM64/
          Copy-Item distrib/Shaders,distrib/Shaders11 _bin/mpc-be_ARM64/ -Recurse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-build-log
          path: arm64-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: MPC-BE-Windows-ARM64
          path: |
            _bin/mpc-be_ARM64/mpc-be-arm64.exe
            _bin/mpc-be_ARM64/mpciconlib.dll
            _bin/mpc-be_ARM64/Lang/*.dll
            _bin/mpc-be_ARM64/MPCBEShellExt64.dll
            _bin/mpc-be_ARM64/*.txt
            _bin/mpc-be_ARM64/Shaders/
            _bin/mpc-be_ARM64/Shaders11/
          if-no-files-found: error
  playback:
    needs: player
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: MPC-BE-Windows-ARM64
          path: player
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: media
      - run: ./contrib/arm64/test-playback.ps1
