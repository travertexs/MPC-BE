name: Verify external renderer fixtures
on:
  push:
    branches: ['arm64/upstream']
    paths:
      - '.github/workflows/renderer-fixtures.yml'
permissions:
  actions: read
  contents: read
jobs:
  external:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44921992216
          name: MPC-BE-ARM64-installer
          path: installer
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44921992216
          name: test-media
          path: media
      - run: |
          $exe = Get-ChildItem installer/*.exe
          $p = Start-Process $exe.FullName '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LANG=en /COMPONENTS=main,mpciconlib,mpcresources,mpcvr,mpcscriptsrc,mpcimagesrc' -Wait -PassThru
          if ($p.ExitCode) {exit $p.ExitCode}
          $dumps = Join-Path $env:RUNNER_TEMP 'PlayerDumps'
          New-Item -ItemType Directory -Path $dumps -Force | Out-Null
          $wer = 'HKLM:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\mpc-be64.exe'
          New-Item $wer -Force | Out-Null
          New-ItemProperty $wer -Name DumpFolder -PropertyType ExpandString -Value $dumps -Force | Out-Null
          try {
            ./contrib/arm64/test-playback.ps1 -PlayerDirectory "$env:ProgramFiles/MPC-BE" -PlayerName mpc-be64.exe -Sources
          } finally {
            Start-Sleep -Seconds 3
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 3 -ErrorAction SilentlyContinue | ForEach-Object {$_.Message}
            $dump = Get-ChildItem $dumps -Filter *.dmp | Select-Object -Last 1
            if ($dump) {
              $dbg = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\*\cdb.exe" | Sort-Object { $_.Directory.Name -ne 'arm64' } | Select-Object -First 1
              if ($dbg) { & $dbg.FullName -z $dump.FullName -c '.ecxr; k; q' }
            }
          }
